name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify tag belongs to main
        if: runner.os == 'Linux'
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "The release tag must point to a commit already present on main."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package, lockfile, Cargo and Tauri versions
        run: npm run verify:release-version -- "${{ github.ref_name }}"

      - name: Run repository checks
        run: npm run check

      - name: Run coverage
        run: npm run test:coverage

      - name: Build web and sidecar
        run: npm run build

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build desktop bundles
        if: runner.os == 'Linux'
        run: npm run build:desktop

      - name: Build Windows NSIS bundle
        if: runner.os == 'Windows'
        run: npm run build:desktop -- --bundles nsis

      - name: Smoke-test bundled runtime
        run: npm run smoke:desktop-runtime

      - name: Create checksums on Linux
        if: runner.os == 'Linux'
        run: |
          find src-tauri/target/release/bundle -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Create checksums on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem -File -Recurse src-tauri/target/release/bundle | Sort-Object FullName
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.FullName)"
          }
          $lines | Set-Content -Encoding utf8 SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blackwall-${{ github.ref_name }}-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: blackwall-${{ github.ref_name }}-Linux
          path: release-assets/linux
      - name: Download Windows assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: blackwall-${{ github.ref_name }}-Windows
          path: release-assets/windows
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -type f | sort)
          gh release create "${{ github.ref_name }}" "${assets[@]}" \
            --draft \
            --prerelease \
            --verify-tag \
            --title "Blackwall ${{ github.ref_name }}" \
            --generate-notes
