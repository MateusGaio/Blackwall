name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          path: .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build
      - name: Validate commit messages
        if: runner.os == 'Linux'
        run: |
          git fetch origin main --no-tags
          npx commitlint --from "$(git merge-base origin/main HEAD)" --to HEAD --verbose
      - uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        if: runner.os == 'Linux'
        with:
          files: ./coverage/lcov.info

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browser on Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright browser on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: npm run e2e:ci

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: .
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Prepare resource path on Linux
        if: runner.os == 'Linux'
        run: mkdir -p desktop-runtime
      - name: Prepare resource path on Windows
        if: runner.os == 'Windows'
        run: New-Item -ItemType Directory -Force -Path desktop-runtime
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  check-required:
    name: check
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Require every check matrix entry
        run: test "${{ needs.check.result }}" = success

  e2e-required:
    name: e2e
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Require every E2E matrix entry
        run: test "${{ needs.e2e.result }}" = success

  rust-required:
    name: rust
    if: always()
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: Require every Rust matrix entry
        run: test "${{ needs.rust.result }}" = success
