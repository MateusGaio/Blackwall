      <rect x="142" y="219" width="196" height="22"/>
      <rect x="142" y="274" width="142" height="22"/>
      <rect x="142" y="329" width="174" height="22"/>
      <rect x="126" y="164" width="8" height="22"/>
      <rect x="126" y="219" width="8" height="22"/>
      <rect x="126" y="274" width="8" height="22"/>
      <rect x="126" y="329" width="8" height="22"/>
      <circle cx="286" cy="175" r="11"/>
