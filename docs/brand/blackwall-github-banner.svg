<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Blackwall — local-first AI harness</title>
  <desc id="desc">Banner preto e branco com a marca tech blob, linhas de código e a palavra Blackwall.</desc>

  <rect width="1200" height="360" fill="#050505"/>
