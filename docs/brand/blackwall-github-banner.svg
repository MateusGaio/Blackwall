    <path d="M688 82h390M736 112h326M652 260h408M712 290h366" stroke-dasharray="7 11"/>
    <path d="M1018 54v252M1080 54v252"/>
  </g>

  <g transform="translate(62 13) scale(.65)">
    <path fill="#f7f7f5" d="M112 145C135 87 202 58 269 70c55 10 91 41 106 87 15 43-4 72 23 108 29 39 18 96-21 125-38 30-77 22-117 41-59 28-132-4-159-57-23-45-7-78-25-117-19-40 1-79 36-112Z"/>
    <g fill="#050505">
