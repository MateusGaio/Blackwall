<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Blackwall — local-first AI harness</title>
  <desc id="desc">A monochrome animated signal moving through the Blackwall mark.</desc>
  <defs>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f2f2f3" stop-opacity=".85"/>
      <stop offset="1" stop-color="#77777d" stop-opacity=".35"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#0a0a0b"/>
  <path d="M36 300H1164M36 60H1164M60 36V324M1140 36V324" stroke="#242428" stroke-width="1"/>
  <rect x="38" y="38" width="1124" height="284" rx="18" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <g transform="translate(100 88)">
    <rect width="184" height="184" fill="none" stroke="#f2f2f3" stroke-width="12"/>
    <path fill="#f2f2f3" d="M34 42h38c24 0 39 10 39 30 0 10-5 18-14 23 13 5 20 14 20 27 0 22-16 35-42 35H34Zm31 22v21h8c6 0 10-4 10-11 0-6-4-10-10-10Zm0 43v24h10c8 0 13-5 13-12s-5-12-13-12Zm64-54h26v54l26-54h29l-33 62 36 60h-30l-28-53v53h-26Z"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#f2f2f3">
    <text x="360" y="132" font-size="56" textLength="570" lengthAdjust="spacingAndGlyphs">BLACKWALL</text>
    <text x="364" y="174" font-size="16" textLength="670" lengthAdjust="spacingAndGlyphs" fill="#a8a8ad">LOCAL-FIRST / AI HARNESS / PRIVATE BY DEFAULT</text>
    <text x="364" y="230" font-size="14" textLength="600" lengthAdjust="spacingAndGlyphs" fill="#77777d">PROFILES · WORKSPACES · SOULS · VAULT · ROUTER</text>
  </g>

  <path d="M364 266H1056" stroke="#3f3f44" stroke-width="2" stroke-dasharray="8 12"/>
  <circle cx="364" cy="266" r="5" fill="#f2f2f3" filter="url(#glow)">
    <animate attributeName="cx" values="364;1056;364" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".25;1;.25" dur="4.8s" repeatCount="indefinite"/>
  </circle>
</svg>
